[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-counting-yolo11"
version = "0.1.0"
description = "Apple detection and image-level counting with YOLO11n on MinneApple"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.1",
  "ultralytics==8.4.163",
  "numpy==2.5.3",
  "Pillow==12.3.0",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
